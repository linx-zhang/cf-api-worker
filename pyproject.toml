[project]
name = "api-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "pytest>=8",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.pytest.ini_options]
# ``src`` 是运行时导入根（worker 里就是 from api.app import app），测试沿用同一套
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
# FastAPI dependency injection uses Depends() in argument defaults by design.
ignore = ["B008"]

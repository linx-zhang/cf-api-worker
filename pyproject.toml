[project]
name = "api-worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "workers-py",
    "workers-runtime-sdk",
]

[tool.ruff.lint]
# FastAPI dependency injection uses Depends() in argument defaults by design.
ignore = ["B008"]
